<!DOCTYPE html>
<html lang="zh-TW" class="h-full bg-slate-950 text-slate-100">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>萌氏 AI 全面智能助手 - 萌希</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        ::-webkit-scrollbar {
            width: 5px;
        }
        ::-webkit-scrollbar-track {
            background: rgba(15, 23, 42, 0.6);
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(51, 65, 85, 0.8);
            border-radius: 9999px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: rgba(71, 85, 105, 1);
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }
    </style>
</head>
<body class="h-full w-full bg-slate-950 flex justify-center items-center overflow-hidden sm:p-4">

    <div class="w-full h-full sm:max-w-md sm:h-[880px] sm:max-h-[95vh] bg-slate-900 sm:rounded-[36px] sm:border-8 sm:border-slate-800/80 shadow-2xl flex flex-col overflow-hidden relative">

        <!-- Top Header Navigation Bar -->
        <header class="h-16 bg-slate-900/90 backdrop-blur-md border-b border-slate-800/80 px-4 flex items-center justify-between shrink-0 z-10 select-none">
            <div class="flex items-center space-x-3">
                <div class="relative">
                    <div class="w-10 h-10 rounded-2xl bg-gradient-to-tr from-pink-500 to-rose-400 flex items-center justify-center text-white font-black text-lg shadow-md shadow-pink-500/20">
                        萌
                    </div>
                    <span class="absolute -bottom-0.5 -right-0.5 w-3.5 h-3.5 bg-emerald-500 border-2 border-slate-900 rounded-full"></span>
                </div>
                <div>
                    <h1 class="text-sm font-bold text-slate-100 tracking-wide flex items-center gap-1.5">
                        萌氏 AI 全面助手 - 萌希
                        <span class="text-[10px] bg-pink-500/10 text-pink-400 border border-pink-500/20 px-1.5 py-0.5 rounded-full font-normal">v2.5</span>
                    </h1>
                    <p class="text-[11px] text-slate-400 flex items-center gap-1">
                        <span class="w-1.5 h-1.5 rounded-full bg-emerald-400 animate-pulse"></span>
                        萌希（Meng-Xi）核心已連線
                    </p>
                </div>
            </div>

            <!-- Top Right Action Buttons -->
            <div class="flex items-center space-x-2">
                <!-- Knowledge Base Expansion / Upload Button (Inline SVG Vector) -->
                <button onclick="openSyncModal()" title="擴充 AI 知識庫" class="w-9 h-9 rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-200 flex items-center justify-center transition border border-slate-700/60 shadow-sm hover:shadow-md">
                    <svg class="w-4 h-4 stroke-slate-200" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M12 4v16m8-8H4" />
                    </svg>
                </button>
            </div>
        </header>

        <!-- Main Chat Box Container -->
        <main id="chatBox" class="flex-1 overflow-y-auto p-4 space-y-4 bg-slate-950/40">
            <!-- Initial AI Greeting Message (Randomized on Load) -->
            <div class="flex items-start space-x-3">
                <div class="w-8 h-8 rounded-xl bg-gradient-to-tr from-pink-500 to-rose-400 flex items-center justify-center text-white font-bold text-xs shrink-0 shadow-sm">
                    萌
                </div>
                <div id="initialGreetingBubble" class="max-w-[82%] bg-slate-800/80 text-slate-100 border border-slate-700/50 rounded-2xl rounded-tl-none p-3.5 text-xs leading-relaxed shadow-sm">
                    <!-- Dynamically filled -->
                </div>
            </div>
        </main>

        <!-- Randomized Prompt Chips Row -->
        <div id="randomChipsContainer" class="px-4 py-2 bg-slate-900/40 border-t border-slate-800/40 flex items-center space-x-2 overflow-x-auto shrink-0 select-none">
            <!-- Dynamically populated -->
        </div>

        <!-- Chat Input Footer -->
        <footer class="p-3 bg-slate-900 border-t border-slate-800/80 shrink-0">
            <div class="flex items-center space-x-2 bg-slate-950/80 border border-slate-800 rounded-2xl p-1.5 focus-within:border-pink-500/50 transition">
                <input id="userInput" type="text" onkeydown="handleKeyPress(event)" placeholder="輸入您想詢問或查詢的內容..." class="flex-1 bg-transparent text-xs text-slate-100 placeholder:text-slate-500 outline-none" />
                <button onclick="sendMessage()" class="w-9 h-9 rounded-xl bg-pink-500 hover:bg-pink-600 text-white flex items-center justify-center transition shrink-0 active:scale-95 shadow-md shadow-pink-500/20">
                    <svg class="w-4 h-4 stroke-white fill-none" viewBox="0 0 24 24" stroke-width="2">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M6 12L3 21l18-9L3 3l3 9zm0 0h7" />
                    </svg>
                </button>
            </div>
        </footer>

        <!-- Knowledge Sync Modal Screen -->
        <div id="syncModal" class="hidden fixed inset-0 bg-slate-950/80 backdrop-blur-sm z-50 flex items-center justify-center p-4">
            <div class="bg-slate-900 border border-slate-800 rounded-3xl w-full max-w-sm p-5 space-y-4 shadow-2xl relative animate-in fade-in zoom-in duration-200">
                <button onclick="closeSyncModal()" class="absolute top-4 right-4 text-slate-400 hover:text-slate-200 p-1">
                    <svg class="w-5 h-5 stroke-current" fill="none" viewBox="0 0 24 24" stroke-width="2">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" />
                    </svg>
                </button>

                <div class="flex items-center space-x-3 border-b border-slate-800 pb-3">
                    <div class="w-9 h-9 rounded-xl bg-slate-800 border border-slate-700 flex items-center justify-center">
                        <svg class="w-5 h-5 stroke-pink-400" fill="none" viewBox="0 0 24 24" stroke-width="2">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M12 4v16m8-8H4" />
                        </svg>
                    </div>
                    <div>
                        <h3 class="text-sm font-bold text-slate-100">擴充 AI 知識庫</h3>
                        <p class="text-[11px] text-slate-400">上傳檔案或純文字補充資料</p>
                    </div>
                </div>

                <!-- Explanation Banner -->
                <div class="bg-slate-800/50 border border-slate-700/60 rounded-xl p-3 text-[11px] text-slate-300 space-y-1">
                    <p class="font-semibold text-pink-400 flex items-center gap-1">
                        💡 為什麼要上傳/同步資料？
                    </p>
                    <p class="text-slate-300 leading-relaxed">
                        您可以提供額外的角卡、遊戲劇本、表格或文件。萌希將會對照這些資料，精準回答您的問題或進行數據分析！
                    </p>
                </div>

                <!-- Upload Form Elements -->
                <div class="space-y-3 pt-1">
                    <div>
                        <label class="block text-[11px] font-medium text-slate-300 mb-1">上傳文字檔 (.txt / .csv)</label>
                        <input type="file" id="fileInput" accept=".txt,.csv,.json" class="block w-full text-xs text-slate-400 file:mr-3 file:py-2 file:px-3 file:rounded-xl file:border-0 file:text-xs file:font-medium file:text-slate-200 file:bg-slate-800 file:hover:bg-slate-700" />
                    </div>

                    <div class="text-center text-[10px] text-slate-500 uppercase tracking-widest font-bold">或</div>

                    <div>
                        <label class="block text-[11px] font-medium text-slate-300 mb-1">直接貼上補充文字</label>
                        <textarea id="pasteInput" rows="4" placeholder="在此處貼上文字內容..." class="w-full bg-slate-950 border border-slate-800 rounded-xl p-2.5 text-xs text-slate-200 outline-none focus:border-pink-500/50"></textarea>
                    </div>
                </div>

                <div class="flex items-center space-x-2 pt-2">
                    <button onclick="closeSyncModal()" class="flex-1 py-2.5 bg-slate-800 hover:bg-slate-700 text-slate-300 rounded-xl text-xs font-medium transition">取消</button>
                    <button onclick="processUpload()" class="flex-1 py-2.5 bg-pink-500 hover:bg-pink-600 text-white rounded-xl text-xs font-semibold shadow-md shadow-pink-500/20 transition">確認擴充</button>
                </div>
            </div>
        </div>

    </div>

    <script>
        // System Knowledge base memory & Remote URL setting
        let localKnowledge = "";
        const OFFICIAL_KNOWLEDGE_URL = "";

        // Pool of all possible opening greetings (Randomized)
        const greetingPool = [
            "嗨嗨～！登場啦! ✨ 我是代表家族根基迎接充滿希望未來的官方 AI 助手——萌希！無論是死亡高考、食物大逃殺還是各大平台作品，隨時告訴我你想知道的事情！",
            "哈囉！我是萌希 ✨ 只要 DM 還活著，或是你想自己找人開團，隨時都可以來萌氏遊樂場胡作非為！今天想查詢什麼規則或作品呢？",
            "主公／玩家您好！我是萌希 🌟 包含 HB 系統、各類食物列表與筆下小說作品我通通掌握了，快來問我問題吧！",
            "安安！我是萌希 ✨ 家族核心已連線！不管是 TRPG 角色單、蕉園小說網還是 YouTube 音樂作品，隨時為您服務！"
        ];

        // Pool of all platform works & prompt suggestions (Randomized pool)
        const allPromptPool = [
            "🎮 查詢食物大逃殺規則",
            "📜 查看死亡高考考生白單",
            "🔗 取得 LINE 社群加入連結",
            "📚 前往蕉園小說網瀏覽",
            "📺 觀看 YouTube 作者作品",
            "🌐 訪問 Portaly 個人專網",
            "📝 進行 16 型人格測驗",
            "🎲 怎麼開始進行遊戲？",
            "💡 DM 不在家可以玩嗎？",
            "✨ 如何進行角色創角？",
            "🍔 食物列表有哪些角色？"
        ];

        // Initialize randomized greeting & chips on page load
        function initApp() {
            const randomGreeting = greetingPool[Math.floor(Math.random() * greetingPool.length)];
            document.getElementById('initialGreetingBubble').innerHTML = randomGreeting;

            const container = document.getElementById('randomChipsContainer');
            container.innerHTML = '';

            let shuffled = [...allPromptPool].sort(() => 0.5 - Math.random());
            let selected = shuffled.slice(0, 3);

            selected.forEach(promptText => {
                const btn = document.createElement('button');
                btn.className = "whitespace-nowrap px-3 py-1.5 bg-slate-800/80 hover:bg-slate-700 text-slate-300 hover:text-white border border-slate-700/60 rounded-xl text-[11px] transition active:scale-95";
                btn.innerText = promptText;
                btn.onclick = () => {
                    document.getElementById('userInput').value = promptText;
                    sendMessage();
                };
                container.appendChild(btn);
            });
        }

        // Run on startup
        window.addEventListener('DOMContentLoaded', () => {
            initApp();
            if (OFFICIAL_KNOWLEDGE_URL) {
                fetch(OFFICIAL_KNOWLEDGE_URL)
                    .then(res => res.text())
                    .then(data => { localKnowledge = data; })
                    .catch(err => console.log("載入遠端官方知識失敗，使用預設核心"));
            }
        });

        // Modal triggers
        function openSyncModal() {
            document.getElementById('syncModal').classList.remove('hidden');
        }

        function closeSyncModal() {
            document.getElementById('syncModal').classList.add('hidden');
        }

        function showNotification(msg) {
            const toast = document.createElement('div');
            toast.className = "fixed top-5 left-1/2 -translate-x-1/2 bg-slate-900 border border-slate-700 text-slate-100 text-xs px-4 py-2.5 rounded-2xl shadow-xl z-50 animate-in fade-in slide-in-from-top";
            toast.innerText = msg;
            document.body.appendChild(toast);
            setTimeout(() => {
                toast.remove();
            }, 2500);
        }

        // Process file or pasted content into knowledge
        function processUpload() {
            const fileInput = document.getElementById('fileInput');
            const pasteInput = document.getElementById('pasteInput');

            if (fileInput.files.length > 0) {
                const file = fileInput.files[0];
                const reader = new FileReader();
                reader.onload = function(e) {
                    localKnowledge += "\n" + e.target.result;
                    showNotification("✅ 檔案已成功解析並擴充！");
                    closeSyncModal();
                    fileInput.value = "";
                };
                reader.readAsText(file);
            } else if (pasteInput.value.trim() !== "") {
                localKnowledge += "\n" + pasteInput.value.trim();
                showNotification("✅ 純文字資料已成功擴充！");
                pasteInput.value = "";
                closeSyncModal();
            } else {
                showNotification("請選擇檔案或貼上文字內容！");
            }
        }

        // Send Message logic with backend knowledge lookup
        async function sendMessage() {
            const input = document.getElementById('userInput');
            const message = input.value.trim();
            if (!message) return;

            renderBubble(message, 'user');
            input.value = '';

            try {
                const response = await fetch('/api/chat', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ message })
                });

                const data = await response.json();
                const aiReply = data && data.answer ? data.answer : '抱歉，萌希目前無法查到相關知識，請稍後再試。';
                renderBubble(aiReply, 'ai');
            } catch (error) {
                console.error('AI chat error:', error);
                renderBubble('⚠️ 連線失敗，請確認後端已啟動，並確認伺服器正在 http://localhost:3000 運行。', 'ai');
            }
        }

        function handleKeyPress(e) {
            if (e.key === 'Enter') {
                sendMessage();
            }
        }

        // Helper to turn raw URLs into clickable links safely opening in new tabs
        function linkifyText(text) {
            const urlRegex = /(https?:\/\/[^\s]+)/g;
            return text.replace(urlRegex, function(url) {
                return `<a href="${url}" target="_blank" rel="noopener noreferrer" class="text-pink-400 hover:underline break-all font-medium">${url}</a>`;
            });
        }

        function renderBubble(text, sender) {
            const chatBox = document.getElementById('chatBox');
            const isUser = sender === 'user';

            const div = document.createElement('div');
            div.className = `flex items-start space-x-3 ${isUser ? 'flex-row-reverse space-x-reverse' : ''}`;

            const avatar = isUser
                ? `<div class="w-8 h-8 rounded-xl bg-slate-800 border border-slate-700 flex items-center justify-center text-slate-300 font-bold text-xs shrink-0">您</div>`
                : `<div class="w-8 h-8 rounded-xl bg-gradient-to-tr from-pink-500 to-rose-400 flex items-center justify-center text-white font-bold text-xs shrink-0 shadow-sm">萌</div>`;

            const bubbleStyle = isUser
                ? 'bg-pink-500 text-white rounded-2xl rounded-tr-none'
                : 'bg-slate-800/80 text-slate-100 border border-slate-700/50 rounded-2xl rounded-tl-none';

            const formattedContent = isUser ? escapeHtml(text) : linkifyText(escapeHtml(text));

            div.innerHTML = `
                ${avatar}
                <div class="max-w-[82%] ${bubbleStyle} p-3.5 text-xs leading-relaxed shadow-sm whitespace-pre-wrap">${formattedContent}</div>
            `;

            chatBox.appendChild(div);
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        function escapeHtml(string) {
            return String(string)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;');
        }

        function clearChat() {
            if (confirm("確定要重啟對話嗎？將會清除目前的聊天記錄。")) {
                const chatBox = document.getElementById('chatBox');
                const randomGreeting = greetingPool[Math.floor(Math.random() * greetingPool.length)];

                chatBox.innerHTML = `
                    <div class="flex items-start space-x-3">
                        <div class="w-8 h-8 rounded-xl bg-gradient-to-tr from-pink-500 to-rose-400 flex items-center justify-center text-white font-bold text-xs shrink-0 shadow-sm">萌</div>
                        <div class="max-w-[82%] bg-slate-800/80 text-slate-100 border border-slate-700/50 rounded-2xl rounded-tl-none p-3.5 text-xs leading-relaxed shadow-sm">
                            ${randomGreeting}
                        </div>
                    </div>
                `;
                initApp();
            }
        }

        document.addEventListener('click', function(e) {
            const link = e.target.closest('a');

            if (link) {
                const href = link.getAttribute('href');

                if (href && (href.startsWith('intent://') || href.startsWith('app-scheme://') || href.startsWith('line://'))) {
                    e.preventDefault();
                    console.log('已攔截外部 App 跳轉');
                    window.open(href, '_blank');
                }
            }
        });
    </script>
</body>
</html>
